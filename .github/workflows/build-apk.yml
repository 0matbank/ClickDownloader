name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Click Downloader APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ClickDownloader-v0.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms"
          echo ""
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Locate APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p release
          cp "$APK_FILE" release/ClickDownloader-v0.2.apk

          ls -lh release/ClickDownloader-v0.2.apk

      - name: Generate SHA256
        run: |
          cd release
          sha256sum ClickDownloader-v0.2.apk > ClickDownloader-v0.2.apk.sha256
          cat ClickDownloader-v0.2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClickDownloader-v0.2-APK
          path: |
            ClickDownloader-v0.2/release/ClickDownloader-v0.2.apk
            ClickDownloader-v0.2/release/ClickDownloader-v0.2.apk.sha256
          if-no-files-found: error
          retention-days: 30
