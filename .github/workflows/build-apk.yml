name: Build Click Downloader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Prepare APK
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/ClickDownloader-v0.3.apk

          cd release
          sha256sum ClickDownloader-v0.3.apk > ClickDownloader-v0.3.apk.sha256

          echo "Generated:"
          ls -lh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClickDownloader-v0.3-APK
          path: |
            release/ClickDownloader-v0.3.apk
            release/ClickDownloader-v0.3.apk.sha256
          if-no-files-found: error
          retention-days: 30
